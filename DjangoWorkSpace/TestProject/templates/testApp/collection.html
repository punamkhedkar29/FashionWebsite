<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Collection</title>
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: var(--bs-light);
            padding: 20px;
        }
        .collection-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }
        .collection-item {
            background: var(--bs-white);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .collection-item img {
            width: 100%;
            border-radius: 10px;
        }
        h3 {
            color: var(--heading-color);
            font-size: 18px;
        }
        p {
            color: var(--bs-body-color);
            font-size: 14px;
        }
        .remove-btn {
            background: var(--bs-primary);
            color: var(--bs-light);
            border: none;
            padding: 8px 12px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .remove-btn:hover {
            background: var(--bs-black);
        }
    </style>
</head>
<body>

    <h1>My Collection</h1>
    <div class="collection-container" id="collectionGrid"></div>

    <script>
        function loadCollection() {
            let collectionGrid = document.getElementById("collectionGrid");
            let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

            collectionGrid.innerHTML = ""; // Clear the grid before loading

            if (favorites.length === 0) {
                collectionGrid.innerHTML = "<p>No products added yet.</p>";
                return;
            }

            favorites.forEach((product, index) => {
                let item = document.createElement("div");
                item.classList.add("collection-item");

                item.innerHTML = `
                    <img src="${product.image}" alt="${product.title}">
                    <h3>${product.title}</h3>
                    <p>${product.description}</p>
                    <button class="remove-btn" onclick="removeFromCollection(${index})">Remove</button>
                `;

                collectionGrid.appendChild(item);
            });
        }

        function removeFromCollection(index) {
            let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
            favorites.splice(index, 1); // Remove item from array
            localStorage.setItem("favorites", JSON.stringify(favorites)); // Update localStorage
            loadCollection(); // Reload the collection
        }

        // Load collection when page loads
        window.onload = loadCollection;
    </script>

</body>
</html>
